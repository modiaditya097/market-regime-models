models:
  - id: model1
    name: "Dynamic Factor Allocation (SJM+BL)"
    output_dir: "outputs"
    module: "shiny_app.modules.model1"
    te_targets: [0.01, 0.02, 0.03, 0.04]
    run_command: ["python", "-u", "main.py"]

  - id: model3
    name: "SC-HMM"
    output_dir: "outputs/model3"
    module: "shiny_app.modules.model3"
    te_targets: [0.03]
    run_command: ["python", "run_sc_hmm.py"]

  - id: simple_hmm
    name: "Simple-HMM (S&P 500)"
    description: "3-state Hidden Markov Model. Training: 2000–2014. Test: 2015–2026."
    output_dir: "outputs/simple_hmm"
    module: "shiny_app.modules.simple_hmm"
    te_targets: [0.03]
    run_command: ["python", "run_user_models.py", "--model", "simple_hmm"]

  - id: msgarch
    name: "MS-GARCH (S&P 500)"
    description: "Markov-Switching GARCH model with volatility-based regime switching. Training: 2000–2014. Test: 2015–2026."
    output_dir: "outputs/msgarch"
    module: "shiny_app.modules.msgarch"
    te_targets: [0.03]
    run_command: ["python", "run_user_models.py", "--model", "msgarch"]

  - id: hmm
    name: "HMM (S&P 500)"
    description: "5-state multi-feature Hidden Markov Model. Training: 2000–2014. Test: 2015–2026."
    output_dir: "outputs/hmm"
    module: "shiny_app.modules.hmm"
    te_targets: [0.03]
    run_command: ["python", "run_user_models.py", "--model", "hmm"]

  - id: hsmm
    name: "HSMM (S&P 500)"
    description: "5-state Hidden Semi-Markov Model with explicit duration modeling. Training: 2000–2014. Test: 2015–2026."
    output_dir: "outputs/hsmm"
    module: "shiny_app.modules.hsmm"
    te_targets: [0.03]
    run_command: ["python", "run_user_models.py", "--model", "hsmm"]
